deployment_type: docker
assigned_username: justinkumpe 
vm_hostname: dev-sandbox
domains:
  - sandbox.dev.kumpe.app
docker_compose: |
  services:
    web:
      image: ghcr.io/justinkumpe/sandbox:latest
      container_name: sandbox-website
      ports:
        - "80:80"
      environment:
        DATABASE_PASSWORD: ${DB_PASSWORD_SECRET}
      restart: unless-stopped
      healthcheck:
        test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 10s
caddy:
  sandbox.conf: |
    sandbox.dev.kumpe.app {
      reverse_proxy localhost:80
    }
env_mappings:
  DATABASE_PASSWORD: DB_PASSWORD_SECRET
deploy_rules:
  - environment: dev
    branches:
      include: [develop, main]
      exclude: []