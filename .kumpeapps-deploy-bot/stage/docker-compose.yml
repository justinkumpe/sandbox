version: '3.8'

services:
  web:
    image: ghcr.io/justinkumpe/sandbox:latest
    container_name: sandbox-website
    ports:
      - "8080:80"
    restart: unless-stopped
    labels:
      - "com.example.description=Sandbox test website"
      - "com.example.environment=development"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Add a reverse proxy (nginx) in front
  # nginx-proxy:
  #   image: nginx:alpine
  #   container_name: sandbox-proxy
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - web
  #   restart: unless-stopped

networks:
  default:
    name: sandbox-network
